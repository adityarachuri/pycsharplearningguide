# PyCSharp — GitLab CI/CD Pipeline
# Replaces: .github/workflows/ci.yml + .github/workflows/documentation.yml

stages:
  - validate   # TypeScript check + build (on every push / MR)
  - docs       # Generate and verify docs (main branch only)

# ── Shared npm cache ──────────────────────────────────────────────────────────
.npm_cache: &npm_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push

# ── Job 1: CI & Quality Gates ─────────────────────────────────────────────────
validate-and-build:
  stage: validate
  image: node:24-alpine
  <<: *npm_cache
  timeout: 10 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # run on every MR
    - if: '$CI_COMMIT_BRANCH == "main"'                   # run on push to main
  before_script:
    - apk add --no-cache git
  script:
    - npm ci
    - npm run lint                   # tsc --noEmit — TypeScript strict typecheck
    - npm run test:coverage         # Vitest with enforced 100% service coverage
    - npm run docs:generate
    - git diff --exit-code -- docs/MODULES_CATALOG.md
    - npm run build                  # production build
    - test -d dist
    - test -f dist/index.html
    - echo "Production build succeeded with all assets intact."
  artifacts:
    paths:
      - dist/
      - coverage/
    expire_in: 1 hour

# ── Job 2: Verify generated Technical Docs ──────────────────────────────────
verify-docs:
  stage: docs
  image: node:24-alpine
  <<: *npm_cache
  timeout: 5 minutes
  rules:
    # Run on direct push to main that touches src/ or scripts/
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - src/**/*
        - scripts/**/*
    # Allow manual verification from GitLab UI
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  before_script:
    - apk add --no-cache git
  script:
    - npm ci
    - node scripts/generate-docs.mjs
    - git diff --exit-code -- docs/MODULES_CATALOG.md
